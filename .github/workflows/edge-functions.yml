name: Vérifier les Edge Functions Supabase
on:
  push:
    branches: [main, reprise/modules-documentaires]
  pull_request:
    branches: [main]
jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Vérifier la fonction de contribution
        run: deno check supabase/functions/submit-contribution/index.ts
