name: Déployer l'administration sur Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-admin-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Compiler et publier l'administration
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la compilation TypeScript
        run: npm run typecheck -w @2passions/admin

      - name: Compiler l'administration
        run: npm run build -w @2passions/admin

      - name: Vérifier les identifiants Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Le secret CLOUDFLARE_API_TOKEN manque dans GitHub." && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Le secret CLOUDFLARE_ACCOUNT_ID manque dans GitHub." && exit 1)

      - name: Déployer sur Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/admin/dist --project-name=2-passions-admin --branch=main
